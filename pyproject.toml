[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdifax"
version = "0.1.0"
description = "Python SDK for the Verdifax cryptographic attestation pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Verdifax", email = "team@verdifax.com" },
]
keywords = [
    "verdifax",
    "attestation",
    "ai",
    "audit",
    "compliance",
    "manifest",
    "hash",
    "provenance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0,<3.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "black>=23.0",
    "mypy>=1.5",
    "build>=1.0",
]

[project.urls]
Homepage = "https://verdifax.com"
Documentation = "https://docs.verdifax.com"
Repository = "https://github.com/verdifax/verdifax-sdk-python"
Issues = "https://github.com/verdifax/verdifax-sdk-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["verdifax*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
verdifax = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
strict = true
python_version = "3.9"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]
