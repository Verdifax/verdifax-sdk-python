name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow calls this one and publishes nothing unless it
  # passes, so no release ships from a commit whose tests fail.
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python line still maintained; the oldest is the package's
        # minimum (requires-python).
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with black
        run: black --check verdifax tests

      - name: Type-check with mypy
        run: mypy verdifax

      - name: Run tests
        run: pytest -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install -r requirements-release.txt

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
